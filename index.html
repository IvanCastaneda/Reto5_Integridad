<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075367"><title>Decisiones que hablan | Reto 5 SDIS</title>
<style>
:root{--navy:#075367;--navy2:#063e4e;--yellow:#f7bd22;--ink:#18313a;--muted:#52646b;--paper:#f3f7f7;--line:#d6e4e6;--white:#fff;--good:#0e705b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.52}header{background:var(--navy);color:white;padding:20px 18px 22px;border-bottom:6px solid var(--yellow)}header .wrap{max-width:760px;margin:auto}header small{display:block;font-weight:700;letter-spacing:.08em;color:#fbe8a1}header h1{font-size:clamp(1.65rem,5.3vw,2.5rem);line-height:1.1;margin:7px 0}header p{margin:0;color:#d4ebee}.wrap{max-width:760px;margin:auto}main{padding:18px 14px 48px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4.5vw,28px);box-shadow:0 3px 14px #0837490b;margin-bottom:16px}.eyebrow{text-transform:uppercase;color:#526b76;font-weight:800;font-size:.76rem;letter-spacing:.07em}.intro{font-size:1.08rem}.progressbar{height:9px;border-radius:10px;background:#dce7e9;overflow:hidden}.progressbar span{display:block;height:100%;background:#13877d;transition:width .2s}h2{line-height:1.2;font-size:1.45rem;margin:7px 0 12px}h3{font-size:1.05rem}.muted{color:var(--muted)}label.field{display:block;font-weight:700;margin-top:14px}input[type=text],textarea{border:1.5px solid #a5bdc2;padding:12px 13px;width:100%;border-radius:12px;font:inherit;margin-top:6px;background:#fff;color:var(--ink)}textarea{min-height:105px;resize:vertical}button{font:inherit;font-weight:750;cursor:pointer;border-radius:12px;padding:12px 18px;border:2px solid var(--navy);background:var(--navy);color:white;min-height:47px}button:hover{filter:brightness(1.09)}button:focus-visible,.choice:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid #e7a718;outline-offset:2px}.secondary{background:white;color:var(--navy)}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btnrow button{flex:1 1 155px}.choice{display:block;border:2px solid var(--line);border-radius:13px;padding:13px 14px;margin:9px 0;cursor:pointer;background:#fff}.choice:has(input:checked){border-color:#087b84;background:#edf8f7}.choice input{accent-color:var(--navy);margin-right:8px;transform:scale(1.2)}.choice strong{color:var(--navy)}.box{border-left:5px solid var(--yellow);padding:13px 15px;background:#fff8e7;border-radius:8px;margin-top:14px}.feedback{border-left-color:#087762;background:#effaf6}.warning{border-left-color:#c38912}.note{font-size:.88rem;color:var(--muted)}.tag{font-size:.8rem;padding:4px 9px;display:inline-block;border-radius:100px;background:#e6f2f2;color:#075367;font-weight:700;margin-bottom:5px}.hidden{display:none!important}ul{padding-left:22px}li{margin:5px 0}.summaryitem{padding:12px 0;border-bottom:1px solid var(--line)}.summaryitem:last-child{border:0}.check{display:flex;align-items:center;gap:9px;margin-top:15px}.check input{width:20px;height:20px;accent-color:var(--navy)}footer{padding:16px;text-align:center;color:var(--muted);font-size:.82rem}#message{color:#9d480b;font-weight:650;min-height:1.5em}@media print{@page{size:auto;margin:12mm}header{background:white;color:black;border-color:#aaa}header p,header small{color:#333}body{background:white}main{padding:0}.panel{box-shadow:none;border:0;border-bottom:1px solid #bbb;border-radius:0}button,.noprint,#progressPanel{display:none!important}#app:not(.report-mode) .panel{display:none!important}#app.report-mode #screen{display:none!important}#report{display:block!important}}@media(max-width:360px){.panel{padding:15px}header{padding:15px}}
select#role{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:7px 0 16px} </style>
</head>
<body>
<header><div class="wrap"><small>GESTORES DE INTEGRIDAD · RETO 5 · 2026</small><h1>Decisiones que hablan</h1><p>¿Y tú qué harías? Conflictos de intereses en el servicio público</p></div></header>
<main class="wrap" id="app"><section class="panel noprint" id="progressPanel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="eyebrow">Tu recorrido</span><span id="progressText" class="muted" aria-live="polite">Inicio</span></div><div class="progressbar" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><span id="progressFill" style="width:0"></span></div></section><div id="screen"></div><section class="panel hidden" id="report"></section></main>
<footer>Actividad pedagógica basada en «Reto 5 – Conflicto de intereses», SDIS 2026. No es un canal oficial para declarar conflictos de intereses.</footer>
<script>
'use strict';
const cases=[
{title:'La familiar que cumple los requisitos',phase:'Fase 1 · Detectives de la integridad',story:'Un funcionario participa en la revisión de hojas de vida para conformar un equipo de apoyo a un proyecto institucional. Entre las personas postuladas está su prima, con quien mantiene una relación cercana. Ella cumple los requisitos y tiene experiencia. El funcionario cree que puede evaluar a todos por igual.',ask:'¿Qué debería hacer antes de continuar la revisión?',opts:['Continuar: su prima cumple los requisitos y él se considera imparcial.','Informar el vínculo familiar por el procedimiento correspondiente y solicitar orientación antes de continuar.','Continuar y contarle la situación únicamente a su prima.'],correct:1,feedback:'Que la candidata cumpla los requisitos no elimina el interés particular. Corresponde informar el vínculo y seguir el procedimiento institucional; no basta con afirmar que se actuará objetivamente.',risk:'Interés particular: vínculo familiar cercano. Riesgo: afectación de la imparcialidad y de la confianza en el proceso.'},
{title:'La información que no debía compartir',phase:'Fase 1 · Detectives de la integridad',story:'Un servidor conoce información interna sobre una decisión institucional aún no comunicada oficialmente. Un amigo cercano le pide una pista para preparar una propuesta vinculada con un trámite próximo. El servidor cree que no habría problema si no entrega documentos.',ask:'¿Cuál sería la actuación más responsable?',opts:['Dar una pista verbal, siempre que no envíe documentos.','Compartir la información únicamente si su amigo promete no divulgarla.','No anticipar información interna y orientar al amigo hacia los canales oficiales de información.'],correct:2,feedback:'Incluso una pista puede generar una ventaja indebida. Es importante preservar la reserva aplicable y la igualdad de trato, utilizando los canales institucionales de divulgación.',risk:'Interés particular: favorecer a un amigo. Riesgo: uso desigual de información institucional todavía no divulgada.'},
{title:'¿Lo informo o me quedo callado?',phase:'Fase 2 · El juicio de las decisiones',story:'Una servidora pública debe intervenir en un asunto que involucra a un familiar. Su jefe le dice que continúe porque confía en su criterio. Ella siente presión y teme que informar la situación parezca una evasión de sus responsabilidades.',ask:'¿Qué decisión defenderías?',opts:['A. Continuar porque su jefe confía en ella.','B. Informar la situación por el procedimiento correspondiente y solicitar orientación antes de continuar.','C. Continuar, pero pedir que un compañero revise su trabajo al final.'],correct:1,feedback:'La alternativa B es la más adecuada. La confianza del jefe o la revisión posterior no reemplazan la comunicación oportuna ni el procedimiento institucional.',risk:'Riesgo: que la presión jerárquica desplace el deber de gestionar un posible conflicto de intereses.'},
{title:'¿Y si todos están de acuerdo?',phase:'Fase 2 · El juicio de las decisiones',story:'Un funcionario identifica una situación que podría constituir un conflicto de intereses. No la informa porque teme que su jefe o sus compañeros piensen que actuó deshonestamente.',ask:'¿Qué opción protege mejor la integridad?',opts:['A. No informar hasta tener certeza de que existe un conflicto.','B. Informar oportunamente y seguir el procedimiento institucional, sin asumir por su cuenta la calificación jurídica.','C. Esperar a que otra persona detecte el posible conflicto.'],correct:1,feedback:'La alternativa B permite prevenir riesgos. Informar un posible conflicto no significa admitir una conducta indebida, sino activar el procedimiento para su valoración.',risk:'Riesgo: ocultar por temor una situación que requiere valoración institucional.'}
];
const state={step:0,alias:'',role:'',answers:[],notes:[],commitment:'',date:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setProgress(){const pct=Math.round(Math.min(state.step,6)/6*100);$('#progressFill').style.width=pct+'%';$('#progressText').textContent=state.step===0?'Inicio':state.step<=4?`Caso ${state.step} de 4`:state.step===5?'Compromiso':'Finalizado';$('#progressTrack').setAttribute('aria-valuenow',pct)}
function render(){setProgress();const screen=$('#screen');$('#report').classList.add('hidden');$('#app').classList.remove('report-mode');if(state.step===0){screen.innerHTML=`<section class="panel"><span class="tag">Aprendizaje individual · celular o computador</span><h2>Bienvenido a tu recorrido de integridad</h2><p class="intro">Analizarás <strong>cuatro situaciones</strong> y decidirás cómo actuar. Cada decisión incluye una explicación para reflexionar, sin calificaciones ni competencias entre compañeros.</p><ul><li>Tiempo orientativo: 10–15 minutos.</li><li>Dos situaciones de investigación y dos dilemas éticos.</li><li>Al finalizar, guarda el comprobante como <strong>PDF</strong> y compártelo con el Gestor de Integridad por el canal que te indique.</li></ul><div class="box"><strong>Privacidad:</strong> esta versión funciona en tu dispositivo. No envía datos ni respuestas a un servidor y no registra automáticamente asistencia. La entrega del PDF al Gestor de Integridad es necesaria para registrar tu participación en esta actividad; compártelo únicamente por el canal institucional indicado.</div><label class="field" for="alias">Nombre del participante (para identificar el comprobante)</label><input id="alias" type="text" maxlength="80" autocomplete="off" placeholder="Escribe tu nombre" value="${esc(state.alias)}"><label class="field" for="role">Rol en el jardín infantil</label><select id="role" required><option value="">Selecciona tu rol</option><option value="Profesional en atención a la primera infancia (PAPI)">Profesional en atención a la primera infancia (PAPI)</option><option value="Auxiliar pedagógica">Auxiliar pedagógica</option><option value="Coordinadora">Coordinadora</option><option value="Auxiliar administrativo">Auxiliar administrativo</option></select><label class="check"><input type="checkbox" id="accept"><span>Entiendo que esta es una actividad formativa, no un trámite oficial de declaración.</span></label><p id="message" role="alert"></p><div class="btnrow"><button id="start">Comenzar actividad</button></div></section>`;$('#start').onclick=()=>{if(!$('#accept').checked){$('#message').textContent='Marca la casilla para continuar.';return}state.alias=$('#alias').value.trim();state.role=$('#role').value;if(!state.role){$('#message').textContent='Selecciona tu rol antes de comenzar.';return}if(!state.alias){$('#message').textContent='Escribe tu nombre para identificar el PDF que entregarás al Gestor de Integridad.';return}state.step=1;render()};}
else if(state.step>=1&&state.step<=4){const i=state.step-1,c=cases[i],answer=state.answers[i];screen.innerHTML=`<section class="panel"><span class="tag">${esc(c.phase)}</span><h2>${esc(c.title)}</h2><p>${esc(c.story)}</p><h3>${esc(c.ask)}</h3><fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow">Selecciona una alternativa</legend>${c.opts.map((o,j)=>`<label class="choice"><input type="radio" name="decision" value="${j}" ${answer===j?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset><div id="feedback" ${answer===undefined?'class="hidden"':''}>${answer===undefined?'':feedbackHTML(c,answer)} </div><label class="field" for="note">Mi reflexión sobre este caso (opcional)</label><textarea id="note" maxlength="1000" placeholder="¿Qué interés particular o riesgo identificaste?">${esc(state.notes[i]||'')}</textarea><p id="message" role="alert"></p><div class="btnrow"><button class="secondary" id="back">Atrás</button><button id="next">${i===3?'Continuar al compromiso':'Siguiente caso'}</button></div></section>`;const radios=[...screen.querySelectorAll('input[name="decision"]')];radios.forEach(r=>r.onchange=()=>{state.answers[i]=+r.value;$('#feedback').innerHTML=feedbackHTML(c,+r.value);$('#feedback').classList.remove('hidden')});$('#back').onclick=()=>{state.notes[i]=$('#note').value;state.step--;render()};$('#next').onclick=()=>{if(state.answers[i]===undefined){$('#message').textContent='Selecciona una alternativa para continuar.';return}state.notes[i]=$('#note').value;state.step++;render()};}
else if(state.step===5){
    screen.innerHTML=`<section class="panel"><span class="tag">Cierre y evidencia</span><h2>Mi compromiso con la integridad</h2><p>La guía invita a reflexionar sobre tres preguntas. Piensa en ellas y escribe un compromiso concreto para tu ejercicio profesional.</p><ol><li>¿Qué debemos hacer cuando identificamos un posible conflicto de intereses?</li><li>¿Por qué no basta con afirmar que podemos actuar objetivamente?</li><li>¿Qué compromiso podemos aplicar en nuestro equipo?</li></ol><label class="field" for="commitment">Mi compromiso concreto</label><textarea id="commitment" maxlength="1500" placeholder="Me comprometo a...">${esc(state.commitment)}</textarea><p class="note">No incluyas información reservada ni nombres de personas implicadas en situaciones reales.</p><p id="message" role="alert"></p><div class="btnrow"><button class="secondary" id="back">Atrás</button><button id="finish">Finalizar y enviar respuestas</button></div></section>`;
    
    $('#back').onclick=()=>{state.commitment=$('#commitment').value;state.step=4;render()};
    
    $('#finish').onclick=async ()=>{
        const v=$('#commitment').value.trim();
        if(v.length<12){$('#message').textContent='Escribe un compromiso concreto de al menos 12 caracteres.';return}
        state.commitment=v;
        
        // Cambiamos el mensaje para que sepan que está cargando
        $('#message').style.color = '#0e705b';
        $('#message').textContent = 'Enviando respuestas, por favor espera...';
        $('#finish').disabled = true;

        // AQUI PEGAS TU URL DE APPS SCRIPT
        const scriptURL = https://script.google.com/macros/s/AKfycbzrBgiBwJj-GYdK2FzlIEULOmDm9N1VdyAFWeb6sUQiNdmBGg-D2qeuTlYGdgedFYFh/exec; 

        try {
            await fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    nombre: state.alias,
                    rol: state.role,
                    respuestas: "Caso 1: " + state.answers[0] + " | Caso 2: " + state.answers[1] + " | Caso 3: " + state.answers[2] + " | Caso 4: " + state.answers[3],
                    compromiso: state.commitment
                })
            });
            // Si el envío es exitoso, pasamos a la pantalla final
            state.step=6;
            render();
        } catch (error) {
            $('#message').style.color = '#c38912';
            $('#message').textContent = 'Hubo un error de conexión. Por favor intenta de nuevo.';
            $('#finish').disabled = false;
        }
    };
}
else {
    // ESTA ES LA NUEVA PANTALLA FINAL (Sin botón de PDF)
    screen.innerHTML=`<section class="panel text-center"><span class="tag">Recorrido completado</span><h2>¡Terminaste el Reto 5!</h2><p>Has revisado las situaciones sobre conflictos de intereses y formulado un compromiso personal.</p><div class="box feedback mt-4"><strong>¡Respuestas enviadas con éxito!</strong><br><br>Gracias por tu participación. Tu información ha sido registrada para consolidar el acta del Jardín Infantil Villa Cristina. Ya puedes cerrar esta ventana.</div></section>`;
}
}

// Renderizado inicial
render();
</script>
</body>
</html>
